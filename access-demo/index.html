<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Centibyt Access</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh;background:linear-gradient(180deg,#0b1020,#111827);color:#fff;display:grid;place-items:center;padding:22px}.card{width:min(430px,100%);background:rgba(17,24,39,.96);border:1px solid #2c3a50;border-radius:28px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.4)}.brand{font-size:12px;letter-spacing:.16em;color:#94a3b8}.badge{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 11px;border-radius:999px;background:#0e2a22;color:#86efac;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 14px #86efac}h1{margin:12px 0 8px;font-size:32px}.desc{margin:0 0 22px;color:#cbd5e1;line-height:1.8}label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:8px}input,button{width:100%;border-radius:17px;padding:16px;font-size:18px}input{border:1px solid #344056;background:#0b1220;color:#fff;text-align:center;outline:none}input:focus{border-color:#64748b}button{margin-top:14px;border:0;background:#fff;color:#111827;font-weight:800;cursor:pointer;transition:.15s}button:active{transform:scale(.99)}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:16px;padding:14px;border-radius:14px;background:#0b1220;text-align:center;color:#cbd5e1;min-height:49px}.ok{color:#86efac}.bad{color:#fca5a5}.note{margin-top:18px;color:#7d8ba3;font-size:12px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="brand">CENTIBYT ACCESS</div>
  <div class="badge"><span class="dot"></span> WEB DEMO ONLINE</div>
  <h1>فتح الباب 🔐</h1>
  <p class="desc">نسخة تجريبية للهاتف. أدخل رمز التجربة ثم اضغط فتح الباب.</p>
  <label for="pin">رمز الدخول</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" />
  <button id="btn" type="button">🔓 فتح الباب</button>
  <div id="status" class="status">جاهز</div>
  <div class="note">هذه الواجهة تختبر إرسال أمر الفتح عبر الإنترنت. ربط الباب الحقيقي سيتم لاحقًا مع ESP32 / Door Controller.</div>
</main>
<script>
const ENDPOINT='https://pbzohbgipieupdebkonb.supabase.co/functions/v1/centibyt-access-demo';
const pin=document.getElementById('pin');
const btn=document.getElementById('btn');
const statusEl=document.getElementById('status');

async function openDoor(){
  const value=pin.value.trim();
  if(!value){
    statusEl.className='status bad';
    statusEl.textContent='أدخل رمز التجربة أولًا';
    return;
  }
  btn.disabled=true;
  statusEl.className='status';
  statusEl.textContent='جاري إرسال أمر الفتح...';
  try{
    const response=await fetch(ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:value})
    });
    const data=await response.json();
    if(response.ok && data.success){
      statusEl.className='status ok';
      statusEl.textContent='تم استقبال أمر الفتح ✓';
      if(navigator.vibrate) navigator.vibrate([80,50,80]);
    }else{
      statusEl.className='status bad';
      statusEl.textContent=data.message || 'فشل أمر الفتح';
    }
  }catch(err){
    statusEl.className='status bad';
    statusEl.textContent='تعذر الاتصال بخدمة الفتح';
  }finally{
    setTimeout(()=>btn.disabled=false,900);
  }
}
btn.addEventListener('click',openDoor);
pin.addEventListener('keydown',e=>{if(e.key==='Enter')openDoor()});
</script>
</body>
</html>
